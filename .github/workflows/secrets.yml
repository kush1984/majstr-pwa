name: Secret scan

# The leak gate. A PWA bundle is PUBLIC by construction — every `VITE_*` value is
# compiled into JavaScript the client downloads — so the one secret-shaped thing
# that may live here is a public VAPID key, and anything else in a commit is a
# mistake. Git history keeps a mistake forever: a token pushed once stays readable
# in the object store after the file is "fixed" in a later commit, so the only
# honest answer is to rotate it. This job turns that into a red build on the push
# that introduces it, while rotating is still the only cost.
#
# Scans the whole HISTORY, not the working tree (`gitleaks git`), which is why the
# checkout is unshallow. Both repos were scanned clean when this landed, so there
# is deliberately NO baseline file to grandfather findings in: the first finding
# this job ever reports is a real one.
#
# `--redact` keeps the secret itself out of the run log — a public log quoting the
# key it found would be a second leak.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the whole history is the point

      # The binary, pinned. Not the official action: it asks organization accounts
      # for a licence key, and the version is what decides which rules run — a
      # floating `latest` would mean a push could redden on a rule nobody added.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the full history
        run: gitleaks git . --redact --no-banner --verbose
