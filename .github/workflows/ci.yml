name: CI

# The gate. Until this existed, `tsc -b`, the 288-test suite and the build ran only
# when the developer remembered — so a type error or a failing outbox test could
# reach master unnoticed (and the backend repo proved that can really happen).
#
# `npm ci` (not `install`) so the committed lockfile is what's actually installed.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (from the lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (app)
        run: npx tsc -b

      # Separate program from the app check (different tsconfig), but just as blocking:
      # the stale-mock backlog these sources carried is cleared, and shared fixtures in
      # src/test/ keep it from coming back. A mock that drifts from its API type now
      # fails CI instead of silently rendering the wrong branch under test.
      - name: Type-check (tests)
        run: npm run typecheck:tests

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      # The offline SHELL check, on the real production bundle.
      #
      # Nothing above it can see this class of bug: the unit suite has no service worker, and
      # the regular e2e runs on the Vite dev server where the SW is deliberately disabled. That
      # is exactly how "Ви не в мережі" on a refreshed deep route reached a real master.
      #
      # Only shell.spec — it needs no backend. The sibling journey.spec registers a real account
      # and drains the outbox, so it needs Postgres + the API and stays a local/manual run until
      # this workflow grows services.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Offline shell e2e (production build + service worker)
        run: npm run test:e2e:offline:shell
