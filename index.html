<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Majstr — професійний кошторис для майстра, без зайвого</title>
    <meta
      name="description"
      content="Створюй кошториси для клієнтів за хвилини, надсилай посиланням і отримуй підпис онлайн. Для електриків, плиточників, сантехніків. Безкоштовно для перших об'єктів."
    />

    <link rel="canonical" href="https://majstr.pro/" />

    <!-- Open Graph (link previews / SEO). Static so crawlers see them without
         running JS; the landing at "/" is the public entry point. -->
    <meta property="og:title" content="Majstr — професійний кошторис для майстра" />
    <meta property="og:description" content="Кошторис за хвилини. Клієнт підписує онлайн. Без зайвого." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://majstr.pro/" />
    <meta property="og:site_name" content="Majstr" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:image" content="https://majstr.pro/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter card (also used by some other scrapers). -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Majstr — професійний кошторис для майстра" />
    <meta name="twitter:description" content="Кошторис за хвилини. Клієнт підписує онлайн. Без зайвого." />
    <meta name="twitter:image" content="https://majstr.pro/icons/icon-512.png" />

    <!-- Structured data: tells Google this is a free web app for contractors. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Majstr",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://majstr.pro/",
      "inLanguage": "uk",
      "description": "Інструмент для майстрів-підрядників: кошториси для клієнтів за хвилини, портал клієнта з онлайн-підписом, PDF з логотипом.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "UAH" }
    }
    </script>

    <!-- Theme + manifest -->
    <meta name="theme-color" content="#F26B1F" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Inter — UI typeface (good Cyrillic coverage). Preconnect so the
         font request starts before CSS is parsed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- iOS PWA tweaks. apple-mobile-web-app-capable lets the user "Add to
         Home Screen" and run standalone. The matching PNG must exist at
         /icons/apple-touch-icon.png — see README for how to generate. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Majstr" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
